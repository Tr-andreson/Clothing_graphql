services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  server:
    build: "./packages/server"
    deploy:
      mode: replicated
      replicas: 1
    expose:
      - "8000"
    environment:
      - DATABASE_URL=mongodb://mongo:27017/mydatabase
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: "./packages/web2"
    ports:
      - "3000:3000"
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

volumes:
  mongo_data:
