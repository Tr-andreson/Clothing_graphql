services:
  server:
    build: "./packages/server/."
    expose:
      - "8000"
    mem_limit: 400m
    cpu_percent: 70

  web:
    build: "./packages/web2/."
    ports:
      - "3000:3000"
    depends_on:
      - "server"
    mem_limit: 400m
  nginx:
    image: nginx:alpine
    cpu_percent: 70
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - "server"
