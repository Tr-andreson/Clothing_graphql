services:
  mongo:
    mem_limit: 512m
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    mem_limit: 512m
    image: redis:alpine
    ports:
      - "6379:6379"

  server:
    mem_limit: 512m
    build: "./packages/server"
    deploy:
      mode: replicated
      replicas: 1

    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - "./packages/server/.env.production"
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    mem_limit: 512m
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

volumes:
  mongo_data:
